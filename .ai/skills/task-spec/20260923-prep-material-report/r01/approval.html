<style>

lid var(--line);border-radius:10px;padding:14px;margin-bottom:18px;box-shadow:var(--shadow)}.progress-line{height:8px;background:#e7ebf2;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--accent);transition:width .2s}.progress-text{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.section{scroll-margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}.section h2{font-size:19px;margin:0 0 4px}.section-note{color:var(--muted);font-size:12px;margin:0 0 14px}.section>h2{cursor:pointer}.section.collapsed>h2:before{content:'鈻?';font-size:12px;color:var(--muted)}.section:not(.collapsed)>h2:before{content:'鈻?';font-size:12px;color:var(--muted)}.section.collapsed>*:not(h2){display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.field{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fbfcfe}.field-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}.field-value{white-space:pre-wrap;overflow-wrap:anywhere}.item-list{display:grid;gap:12px}.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.card-title{font-weight:750}.tag{display:inline-block;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:700;background:var(--info-bg);color:#3730a3;margin-right:6px}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.danger{background:var(--danger-bg);color:var(--danger)}.card-body{margin-top:10px}.card-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.decision-card{border-left:4px solid #7c5cff}.decision-card.resolved{border-left-color:var(--ok)}.decision-card.rejected{border-left-color:var(--danger)}.decision-state{font-size:12px;font-weight:700;color:var(--muted)}details.raw{margin-top:10px}details.raw summary{cursor:pointer;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;overflow:auto;background:#f3f5f8;border-radius:7px;padding:10px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;margin:8px 0 0}.sticky-actions{position:fixed;bottom:0;left:252px;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px clamp(18px,4vw,52px);display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:5}.sticky-actions .hint{color:var(--muted);font-size:12px;margin-right:auto}.empty{color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:8px}.footer-note{color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:800px){.shell{display:block}.sidebar{position:sticky;height:auto;z-index:4;padding:10px 12px}.brand,.subbrand{display:inline;margin:0 8px}.subbrand{font-size:11px}.nav-title{display:none}.nav{display:flex;overflow-x:auto;gap:4px;margin-top:8px}.nav a{white-space:nowrap;font-size:12px}.nav .count{display:none}.main{padding:18px 12px 150px}.hero{display:block}.hero .status{margin-top:12px}.sticky-actions{left:0;padding:10px 12px}}

<body>
<div class="shell">

<div class="progress-wrap"><div class="progress-text"><span>浜哄伐鍐崇瓥澶勭悊杩涘害</span><span id="progress-text">0 / 0</span></div><div class="progress-line"><div class="progress-bar" id="progress-bar"></div></div></div>

</main>
</div>
<div class="sticky-actions"><span class="hint" id="action-hint">鍏堟煡鐪嬪苟澶勭悊蹇呰鐨勪汉宸ュ喅绛栥€?/span><label style="width:180px"><input id="actor" placeholder="瀹℃壒浜? aria-label="瀹℃壒浜?></label><button class="ok" data-action="APPROVED">鎵瑰噯璁″垝</button><button class="danger" data-action="REJECTED">椹冲洖璁″垝</button><button class="warn" data-action="CHANGES_REQUESTED">鎻愪氦淇敼鎰忚</button><button class="small" id="approve-all">鍏ㄩ儴纭浜哄伐鍐崇瓥</button><textarea id="overall-comment" rows="1" style="max-width:260px" placeholder="鎬讳綋璇存槑"></textarea><textarea id="output" rows="2" style="display:none"></textarea></div>
<script id="plan-data" type="application/json"></script>
<script>
(function(){
'use strict';
const plan=JSON.parse(document.getElementById('plan-data').textContent);
const navItems=[['summary','闇€姹傛憳瑕?],['current','褰撳墠琛屼负'],['target','鐩爣琛屼负'],['facts','浠ｇ爜浜嬪疄'],['inferences','鎺ㄦ柇'],['behavior','琛屼负瑙勫垯'],['scope','鑼冨洿'],['technical','鎶€鏈柟妗?],['references','鍙傝€冧唬鐮?],['packages','鎵ц鍖?],['risks','椋庨櫓'],['acceptance','Acceptance Criteria'],['decisions','浜哄伐鍐崇瓥'],['audit','瀹℃壒淇℃伅']];
const escText=function(value){if(value===null||value===undefined||value===''){return '鏈彁渚?;}if(typeof value==='string'){return value;}return JSON.stringify(value,null,2);};
const labelize=function(key){return String(key).replace(/_/g,' ');};
const make=function(tag,className,text){const el=document.createElement(tag);if(className){el.className=className;}if(text!==undefined){el.textContent=text;}return el;};
const rawDetails=function(value){const details=make('details','raw');details.appendChild(make('summary','', '鏌ョ湅鍘熷 JSON'));const pre=make('pre','',JSON.stringify(value,null,2));details.appendChild(pre);return details;};
const fields=function(value){const box=make('div','grid');if(value===null||value===undefined){box.appendChild(make('div','empty','鏈彁渚?));return box;}if(typeof value!=='object'){box.appendChild(make('div','field',''));box.firstChild.appendChild(make('div','field-value',''+escText(value)));return box;}Object.keys(value).forEach(function(key){const item=make('div','field');item.appendChild(make('div','field-label',labelize(key)));item.appendChild(make('div','field-value',escText(value[key])));box.appendChild(item);});return box;};
const listCards=function(list,kind){const box=make('div','item-list');if(!Array.isArray(list)||list.length===0){box.appendChild(make('div','empty','鏃?));return box;}list.forEach(function(item,index){const card=make('article','card');const header=make('div','card-header');const title=make('div','card-title');if(item&&item.id){title.appendChild(make('span','tag',item.id));}title.appendChild(make('span','tag',kind));title.appendChild(make('span','',item&& (item.title||item.name||item.question||item.text) ? (item.title||item.name||item.question||item.text) : kind+' '+(index+1)));header.appendChild(title);card.appendChild(header);card.appendChild(make('div','card-body')).appendChild(fields(item));card.appendChild(rawDetails(item));box.appendChild(card);});return box;};
const sections={summary:{title:'闇€姹傛憳瑕?,note:'闇€姹傜洰鏍囥€侀棶棰樸€佷环鍊间笌澶嶆潅搴?,value:plan.summary},current:{title:'褰撳墠琛屼负',note:'鍩轰簬浠ｇ爜浜嬪疄鐨勫綋鍓嶇姸鎬?,value:plan.current_state},target:{title:'鐩爣琛屼负',note:'鏄庣‘闇€姹備笌鍩轰簬浜嬪疄鐨勬帹鏂?,value:plan.target_state},facts:{title:'浠ｇ爜浜嬪疄',note:'浠ｇ爜瑙傚療銆佽瘉鎹拰褰撳墠绾︽潫',value:plan.current_state&&plan.current_state.facts?plan.current_state.facts:(plan.facts||plan.business_rules)},inferences:{title:'鎺ㄦ柇',note:'鐢变簨瀹炴帹瀵肩殑瀹炵幇鍒ゆ柇',value:plan.inferences||(plan.target_state&&plan.target_state.inferences)||(plan.target_state&&plan.target_state.inferred_behavior)},behavior:{title:'琛屼负瑙勫垯',note:'姝ｅ父銆佸け璐ャ€侀噸澶嶅拰杈圭晫鍦烘櫙',value:plan.behavior},scope:{title:'鑼冨洿',note:'In Scope銆丱ut of Scope 涓庡疄鏂借竟鐣?,value:plan.scope},technical:{title:'鎶€鏈柟妗?,note:'鎶€鏈柟鍚戙€佹柟妗堝姣斿拰渚濊禆鍏崇郴',value:plan.technical_direction},references:{title:'鍙傝€冧唬鐮?,note:'鐩镐技鍘熷洜銆佸鐢ㄨ竟鐣屻€侀仐鐣欎笌鏋舵瀯閫傞厤鎬?,value:plan.reference_code_assessment},packages:{title:'鎵ц鍖?,note:'鎸変緷璧栭『搴忔墽琛岀殑浠诲姟鍖呫€乵anifest銆佽竟鐣屼笌濂戠害',value:plan.packages},risks:{title:'椋庨櫓',note:'椋庨櫓绛夌骇銆佸奖鍝嶅拰缂撹В/楠岃瘉鎺柦',value:plan.risks},acceptance:{title:'Acceptance Criteria',note:'鍙敱 Review 楠岃瘉鐨勬渶缁堝彲瑙傚療缁撴灉',value:plan.acceptance_criteria}};
const nav=document.getElementById('nav');navItems.forEach(function(entry){const a=document.createElement('a');a.href='#section-'+entry[0];a.dataset.target=entry[0];a.appendChild(make('span','',entry[1]));if(entry[0]==='decisions'){const count=Array.isArray(plan.open_decisions)?plan.open_decisions.filter(function(x){return x.resolution==='user-required';}).length:0;a.appendChild(make('span','count',String(count)));}nav.appendChild(a);});
const content=document.getElementById('content');Object.keys(sections).forEach(function(key){const section=sections[key];const el=make('section','section');el.id='section-'+key;const heading=make('h2','',section.title);heading.onclick=function(){el.classList.toggle('collapsed');};el.appendChild(heading);el.appendChild(make('p','section-note',section.note));if(Array.isArray(section.value)){el.appendChild(listCards(section.value,key));}else{el.appendChild(fields(section.value));el.appendChild(rawDetails(section.value));}content.appendChild(el);});
const decisionSection=make('section','section');decisionSection.id='section-decisions';decisionSection.appendChild(make('h2','','浜哄伐鍐崇瓥'));decisionSection.appendChild(make('p','section-note','姣忎釜 user-required Decision 鐙珛纭锛涘畬鎴愬悗鍐嶆墽琛岃鍒掔骇鎵瑰噯銆俛uto-resolved 椤逛粎灞曠ず锛屼笉鍗犵敤瀹℃壒銆?));const decisionBox=make('div','item-list');decisionSection.appendChild(decisionBox);content.appendChild(decisionSection);
const audit=make('section','section');audit.id='section-audit';audit.appendChild(make('h2','','瀹℃壒淇℃伅'));audit.appendChild(make('p','section-note','璁″垝韬唤銆佹潵婧愬拰瀹屾暣缁撴瀯鐢ㄤ簬瀹℃壒鑴氭湰鏍￠獙銆?));audit.appendChild(fields({plan_package_id:plan.plan_package_id,package_revision:plan.package_revision,package_sha256:plan.plan_package_sha256,spec:plan.spec,status:plan.status}));audit.appendChild(rawDetails({plan_package_id:plan.plan_package_id,package_revision:plan.package_revision,package_sha256:plan.plan_package_sha256,spec:plan.spec,status:plan.status}));content.appendChild(audit);
document.getElementById('title').textContent=plan.title||plan.description||'鏈懡鍚嶈鍒?;document.getElementById('side-id').textContent=(plan.plan_package_id||'')+' 路 r'+plan.package_revision;document.getElementById('meta').textContent='Spec '+(plan.spec&&plan.spec.spec_id?plan.spec.spec_id:'鏈彁渚?)+' 路 Package '+(plan.plan_package_id||'鏈彁渚?)+' 路 SHA-256 '+(plan.plan_package_sha256||'鏈彁渚?);
const decisions=Array.isArray(plan.open_decisions)?plan.open_decisions:[];const actionable=decisions.filter(function(item){return item.resolution==='user-required';});const itemDecisions={};
const decisionText=function(item){return {id:item.id,question:item.question||item.decision||item.text,options:item.options,recommendation:item.recommendation||item.planner_recommendation,user_decision:item.user_decision,resolution:item.resolution,blocking:item.blocking,source:item.source,based_on:item.based_on,impact:item.impact};};
const renderDecisions=function(){decisionBox.textContent='';if(decisions.length===0){decisionBox.appendChild(make('div','empty','娌℃湁闇€瑕佷汉宸ュ喅绛栫殑椤圭洰銆?));}decisions.forEach(function(item){const card=make('article','card decision-card');const state=itemDecisions[item.id]?itemDecisions[item.id].decision:'PENDING';if(state==='APPROVED'){card.classList.add('resolved');}if(state==='REJECTED'){card.classList.add('rejected');}const header=make('div','card-header');const title=make('div','card-title');title.appendChild(make('span','tag',item.id||'D'));title.appendChild(make('span','tag',item.resolution||'auto-resolved'));title.appendChild(make('span','',item.question||item.decision||item.text||'鏈懡鍚嶅喅绛?));header.appendChild(title);header.appendChild(make('span','decision-state',state+(item.blocking?' 路 blocking':'')));card.appendChild(header);card.appendChild(make('div','card-body')).appendChild(fields(decisionText(item)));card.appendChild(rawDetails(item));if(item.resolution==='user-required'){const textarea=make('textarea','');textarea.rows=2;textarea.placeholder='璇?Decision 鐨勭‘璁よ鏄庢垨淇敼鎰忚';textarea.id='comment-'+item.id;card.appendChild(textarea);const actions=make('div','card-actions');[['APPROVED','纭/鎵瑰噯','ok'],['REJECTED','椹冲洖','danger'],['CHANGES_REQUESTED','瑕佹眰淇敼','warn']].forEach(function(buttonInfo){const button=make('button',buttonInfo[2],buttonInfo[1]);button.type='button';button.onclick=function(){const comment=document.getElementById('comment-'+item.id).value.trim();if(buttonInfo[0]!=='APPROVED'&&!comment){document.getElementById('action-hint').textContent='璇峰厛濉啓 '+item.id+' 鐨勬剰瑙併€?;return;}itemDecisions[item.id]={id:item.id,kind:'decision',decision:buttonInfo[0],actor:document.getElementById('actor').value.trim(),comment:comment,decided_at:new Date().toISOString()};renderDecisions();};actions.appendChild(button);});card.appendChild(actions);}decisionBox.appendChild(card);});updateProgress();};
const updateProgress=function(){const total=actionable.length;const done=actionable.filter(function(item){return itemDecisions[item.id]&&itemDecisions[item.id].decision==='APPROVED';}).length;document.getElementById('progress-text').textContent=done+' / '+total;document.getElementById('progress-bar').style.width=(total?Math.round(done*100/total):100)+'%';document.getElementById('action-hint').textContent=total?'宸茬‘璁?'+done+' / '+total+' 涓繀瑕佷汉宸ュ喅绛栥€?:'娌℃湁闃诲浜哄伐鍐崇瓥锛屽彲鐩存帴杩涜璁″垝绾у鎵广€?;};
const exportApproval=function(action){const actor=document.getElementById('actor').value.trim();if(!actor){document.getElementById('action-hint').textContent='璇峰～鍐欏鎵逛汉銆?;return;}const feedback=[];Object.keys(itemDecisions).forEach(function(id){const item=itemDecisions[id];feedback.push({id:item.id,kind:'decision',comment:item.comment||'',decision:item.decision,actor:actor,decided_at:item.decided_at});});if(action==='APPROVED'){const blocked=actionable.filter(function(item){return item.blocking===true&&(!itemDecisions[item.id]||itemDecisions[item.id].decision!=='APPROVED');});if(blocked.length){document.getElementById('action-hint').textContent='浠嶆湁鏈‘璁ょ殑闃诲浜哄伐鍐崇瓥锛屼笉鑳芥壒鍑嗚鍒掋€?;return;}}const out={schema_version:'1.0',spec_id:plan.spec.spec_id,package_revision:plan.package_revision,package_sha256:plan.plan_package_sha256,decision:action,actor:actor,decided_at:new Date().toISOString(),statement:document.getElementById('overall-comment').value.trim(),item_decisions:feedback,item_feedback:feedback.map(function(item){return {id:item.id,comment:item.comment};})};const text=JSON.stringify(out,null,2);document.getElementById('output').value=text;const blob=new Blob([text],{type:'application/json'});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download='approval-input.json';link.click();setTimeout(function(){URL.revokeObjectURL(url);},0);document.getElementById('action-hint').textContent='宸插鍑?approval-input.json锛岃鎶婃枃浠惰矾寰勪氦缁?AI 瀵煎叆銆?;};
document.getElementById('approve-all').onclick=function(){const actor=document.getElementById('actor').value.trim();if(!actor){document.getElementById('action-hint').textContent='璇峰～鍐欏鎵逛汉銆?;return;}actionable.forEach(function(item){itemDecisions[item.id]={id:item.id,kind:'decision',decision:'APPROVED',actor:actor,comment:'鍏ㄩ儴纭',decided_at:new Date().toISOString()};});renderDecisions();};document.querySelectorAll('button[data-action]').forEach(function(button){button.onclick=function(){exportApproval(button.dataset.action);};});
renderDecisions();
const observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('active',a.dataset.target===entry.target.id.replace('section-',''));});}});},{rootMargin:'-15% 0px -70% 0px'});document.querySelectorAll('.section').forEach(function(section){observer.observe(section);});
})();
</script>
